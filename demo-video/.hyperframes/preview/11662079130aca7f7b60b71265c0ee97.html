    <style>
      :root {
        --ground: #0d0f17;
        --accent: #6366f1;
        --cyan: #06b6d4;
        --ink: #f8fafc;
        --muted: #94a3b8;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.15) 0%, rgba(13, 15, 23, 1) 75%);
      }
      .badge {
        padding: 10px 24px;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: var(--cyan);
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        margin-bottom: 32px;
      }
      .headline {
        color: var(--ink);
        font-size: 88px;
        font-weight: 800;
        letter-spacing: -0.03em;
        text-align: center;
        line-height: 1.1;
        margin-bottom: 24px;
      }
      .gradient-text {
        background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .subtitle {
        color: var(--muted);
        font-size: 32px;
        font-weight: 400;
        text-align: center;
        max-width: 900px;
        line-height: 1.5;
      }
      .card-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .glow-orb {
        position: absolute;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(6, 182, 212, 0) 70%);
        pointer-events: none;
      }
