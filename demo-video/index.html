<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --ground: #0d0f17;
        --accent: #6366f1;
        --cyan: #06b6d4;
        --ink: #f8fafc;
        --muted: #94a3b8;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.15) 0%, rgba(13, 15, 23, 1) 75%);
      }
      .badge {
        padding: 10px 24px;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: var(--cyan);
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        margin-bottom: 32px;
      }
      .headline {
        color: var(--ink);
        font-size: 88px;
        font-weight: 800;
        letter-spacing: -0.03em;
        text-align: center;
        line-height: 1.1;
        margin-bottom: 24px;
      }
      .gradient-text {
        background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .subtitle {
        color: var(--muted);
        font-size: 32px;
        font-weight: 400;
        text-align: center;
        max-width: 900px;
        line-height: 1.5;
      }
      .card-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .glow-orb {
        position: absolute;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(6, 182, 212, 0) 70%);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-z7xn"
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <div data-hf-id="hf-zx1b" id="orb" class="glow-orb clip" data-start="0" data-duration="5" data-track-index="0"></div>
      
      <div data-hf-id="hf-tuub" class="card-wrap clip" data-start="0" data-duration="5" data-track-index="1">
        <div data-hf-id="hf-kn6d" id="badge" class="badge">HyperFrames AI Video</div>
        <h1 data-hf-id="hf-g3yv" id="title" class="headline">Code to Video <br data-hf-id="hf-x5px"><span data-hf-id="hf-ugfy" class="gradient-text">Built for AI Agents</span></h1>
        <p data-hf-id="hf-ufkz" id="sub" class="subtitle">Render HTML, CSS, and GSAP directly into high-fidelity MP4 locally.</p>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Animate glowing orb background
      tl.fromTo("#orb", 
        { scale: 0.6, opacity: 0 }, 
        { scale: 1.3, opacity: 0.8, duration: 4, ease: "power2.out" }, 
        0
      );

      // Animate badge
      tl.fromTo("#badge",
        { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.8, ease: "back.out(1.7)" },
        0.3
      );

      // Animate title
      tl.fromTo("#title",
        { y: 40, opacity: 0, scale: 0.95 },
        { y: 0, opacity: 1, scale: 1, duration: 1.0, ease: "power3.out" },
        0.6
      );

      // Animate subtitle
      tl.fromTo("#sub",
        { y: 20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.8, ease: "power2.out" },
        1.0
      );

      // Subtle breath out towards end
      tl.to("#title", { scale: 1.03, duration: 3, ease: "sine.inOut" }, 1.6);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
